<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="utf-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme -->
    <meta name="theme-color" content="#16a34a" />

    <!-- SEO -->
    <title>EcoWear | Sustainable Fashion & Eco-Friendly Clothing</title>

    <meta
      name="description"
      content="EcoWear is your destination for sustainable fashion. Shop eco-friendly clothing, organic cotton apparel, recycled fashion, and environmentally conscious styles."
    />

    <meta
      name="keywords"
      content="EcoWear, sustainable fashion, eco-friendly clothing, organic cotton, recycled fashion, green clothing, ethical fashion, eco store, fashion ecommerce"
    />

    <meta name="author" content="Mohd Afzal" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="%PUBLIC_URL%/ecowear-logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/ecowear-logo.png"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EcoWear | Sustainable Fashion" />
    <meta
      property="og:description"
      content="Discover eco-friendly clothing made from sustainable materials. Shop ethical fashion with EcoWear."
    />
    <meta property="og:image" content="%PUBLIC_URL%/ecowear-logo.png" />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:site_name" content="EcoWear" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="EcoWear | Sustainable Fashion"
    />
    <meta
      name="twitter:description"
      content="Eco-friendly clothing made with sustainability in mind."
    />
    <meta
      name="twitter:image"
      content="%PUBLIC_URL%/ecowear-logo.png"
    />

    <!-- Browser -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Performance -->
    <link rel="dns-prefetch" href="//checkout.razorpay.com" />
    <link rel="preconnect" href="https://checkout.razorpay.com" />

    <!-- Razorpay -->
    <script
      src="https://checkout.razorpay.com/v1/checkout.js"
      defer
    ></script>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run EcoWear.
    </noscript>

    <div id="root"></div>
  </body>
</html>
